name: Recovery Build - Moto G 2025

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/PitchBlackRecoveryProject/manifest_pb.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'android-12.1' # PBRP standard for modern devices
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/councilcj/android-device-tree-motog2025kansas/tree/main'
      USER_NAME:
        description: 'councilcj'
        required: true
        default: 'AI-Collaborator'
      USER_EMAIL:
        description: 'councilcj344@gmail.com'
        required: true
        default: 'tester@example.com'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt install git aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sudo bash setup/install_android_sdk.sh

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${{ github.event.inputs.USER_NAME }}"
        git config --global user.email "${{ github.event.inputs.USER_EMAIL }}"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)
      working-directory: workspace

    - name: Clone device tree
      run: |
        # Hardcoded for Moto G 2025 (kansas)
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b main ./device/motorola/kansas
      working-directory: workspace

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        # Hardcoded lunch for your specific makefile name
        lunch omni_kansas-eng || lunch omni_boot-eng
        make clean
        make bootimage -j$(nproc --all)
      working-directory: workspace

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/kansas/boot.img
        name: kansas-PBRP-Build
        tag_name: ${{ github.run_id }}
        body: "Custom Recovery Build for Moto G 2025 (kansas)"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
