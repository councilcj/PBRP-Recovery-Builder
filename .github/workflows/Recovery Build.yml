name: Recovery Build - Moto G 2025 - Bruteforce

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare environment
      run: |
        sudo apt update
        sudo apt install git aria2 python3 python3-pip -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Initialize & Sync
      run: |
        mkdir workspace
        cd workspace
        repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b android-12.1
        repo sync -c -j$(nproc --all) --force-sync
      working-directory: .

    - name: Clone device tree
      run: |
        git clone https://github.com/councilcj/android-device-tree-motog2025kansas ./device/motorola/kansas
      working-directory: workspace

    - name: Set Swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: BRUTEFORCE ASSEMBLY
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_kansas-eng || lunch omni_boot-eng
        
        # 1. Build ONLY the ramdisk (The TWRP/PBRP core)
        # This bypasses the DTB/Kernel check because it doesn't make a full image yet
        m recoveryramdisk -j$(nproc --all)
        
        # 2. FIND THE TOOLS
        # Android hides its tools, so we find mkbootimg ourselves
        MKBOOTIMG=$(find . -name mkbootimg.py | head -n 1)
        
        # 3. SMASH IT TOGETHER
        # We point directly to your files in the device tree. No rules, no safety.
        python3 $MKBOOTIMG \
          --kernel device/motorola/kansas/kernel \
          --ramdisk out/target/product/kansas/ramdisk-recovery.img \
          --dtb device/motorola/kansas/dtb.img \
          --header_version 4 \
          --os_version 14.0.0 \
          --os_patch_level 2026-01 \
          --pagesize 4096 \
          --board "kansas" \
          --cmdline "androidboot.boot_devices=soc/11270000.ufshci loop.max_part=7 mtk_disp_mgr.wait_vblank=0 video=720x1604@60" \
          --output out/target/product/kansas/boot.img

        # 4. Success Check
        ls -lh out/target/product/kansas/boot.img
      working-directory: workspace

    - name: Upload
      uses: softprops/action-gh-release@v1
      with:
        files: workspace/out/target/product/kansas/boot.img
        name: kansas-Bruteforce-Build
        tag_name: ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
